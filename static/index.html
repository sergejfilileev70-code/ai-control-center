
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>AI Control Center</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: #edf2ff;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .container {
      width: min(100% - 32px, 1050px);
      margin: 0 auto;
      padding: 55px 0;
    }

    header {
      margin-bottom: 35px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #9baeff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .logo-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #715cff, #29b6d1);
      color: white;
      font-size: 20px;
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: #98a5c4;
      max-width: 620px;
      font-size: 15px;
    }

    .panel {
      padding: 28px;
      border: 1px solid #26314d;
      border-radius: 20px;
      background: #111a30;
      box-shadow: 0 20px 60px #00000030;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #dce4ff;
      font-size: 13px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #34415f;
      border-radius: 11px;
      outline: none;
      background: #0b1326;
      color: #fff;
      font: inherit;
      transition: border .2s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #8171ff;
    }

    textarea {
      min-height: 175px;
      resize: vertical;
    }

    .field {
      margin-bottom: 23px;
    }

    .hint {
      margin-top: 7px;
      color: #8390ae;
      font-size: 12px;
    }

    .counter {
      text-align: right;
      color: #8390ae;
      font-size: 12px;
      margin-top: 5px;
    }

    select {
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(100deg, #705cff, #427de9);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    #error {
      margin-top: 15px;
      color: #ff858e;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .hidden {
      display: none !important;
    }

    #results {
      margin-top: 30px;
    }

    .result-card {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid #263653;
      border-radius: 15px;
      background: #111a30;
    }

    .result-card h3 {
      margin: 0 0 13px;
      font-size: 16px;
    }

    .result-card p {
      margin: 0;
      color: #d1dbf4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.8;
    }

    .final-card {
      border-color: #6557c8;
      background: #171c39;
    }

    .final-card h3 {
      color: #b8adff;
    }

    .tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #29264f;
      color: #c2b8ff;
      font-size: 11px;
      font-weight: 700;
    }

    footer {
      margin-top: 30px;
      color: #65728e;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 0;
      }

      .panel {
        padding: 19px;
      }

      .result-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="logo">
        <span class="logo-icon">✦</span>
        AI Control Center
      </div>

      <h1>Центр управления<br>искусственным интеллектом</h1>

      <p class="subtitle">
        Два независимых AI-эксперта анализируют задачу,
        проверяют аргументы и формируют единый итоговый ответ.
      </p>
    </header>

    <section class="panel">

      <div class="field">
        <label for="password">Пароль приложения</label>
        <input
          id="password"
          type="password"
          placeholder="Введите пароль"
          autocomplete="current-password"
        >
      </div>

      <div class="field">
        <label for="mode">Режим работы AI-агентов</label>
        <select id="mode">
          <option value="review">ChatGPT → Claude → Итоговая проверка</option>
          <option value="parallel">Параллельный независимый анализ</option>
          <option value="sequential">Последовательная работа агентов</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Ваша задача</label>
        <textarea
          id="message"
          maxlength="12000"
          placeholder="Опишите задачу, вопрос или проблему. Чем больше полезного контекста, тем точнее будет анализ..."
        ></textarea>
        <div class="counter" id="counter">0 / 12000</div>
      </div>

      <button id="send" type="button">
        Запустить анализ <span>↗</span>
      </button>

      <div id="error" role="alert"></div>
    </section>

    <section id="results" class="hidden">

      <div class="result-card final-card">
        <span class="tag">ИТОГОВЫЙ РЕЗУЛЬТАТ</span>
        <h3 id="modeLabel">Общий вывод</h3>
        <p id="final"></p>
      </div>

      <div class="result-card">
        <h3>✦ Анализ ChatGPT</h3>
        <p id="gpt"></p>
      </div>

      <div class="result-card">
        <h3>✦ Анализ Claude</h3>
        <p id="claude"></p>
      </div>

    </section>

    <footer>
      AI Control Center · Powered by OpenAI & Anthropic
    </footer>

  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const message = $("message");

    message.addEventListener("input", () => {
      $("counter").textContent =
        `${message.value.length} / 12000`;
    });

    function show(id, value) {
      $(id).textContent = value || "Нет данных.";
    }

    $("send").addEventListener("click", async () => {
      $("error").textContent = "";

      const password = $("password").value;

      if (!password) {
        $("error").textContent = "Введите пароль приложения.";
        return;
      }

      if (message.value.trim().length < 2) {
        $("error").textContent = "Введите задачу.";
        return;
      }

      const button = $("send");
      button.disabled = true;
      button.textContent = "Агенты работают…";

      $("results").classList.add("hidden");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-App-Password": password
          },
          body: JSON.stringify({
            message: message.value,
            mode: $("mode").value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || "Не удалось выполнить запрос."
          );
        }

        show("final", data.final);
        show("gpt", data.openai);
        show("claude", data.claude);

        $("modeLabel").textContent =
          $("mode").selectedOptions[0].text.split(" → ")[0];

        $("results").classList.remove("hidden");

        $("results").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      } catch (err) {
        $("error").textContent =
          err.message || "Произошла ошибка соединения.";
      } finally {
        button.disabled = false;
        button.innerHTML =
          'Запустить анализ <span>↗</span>';
      }
    });
  </script>
</body>
</html>
